name: Reproducibility CI
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: airflow
          POSTGRES_PASSWORD: airflow
          POSTGRES_DB: spotify_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: |
          mkdir -p data/source
          echo "track_id,popularity,danceability,energy,valence,acousticness,liveness,loudness,tempo,key,mode,time_signature,instrumentalness,speechiness,track_genre" > data/source/dataset.csv
          echo "1,50,0.5,0.5,0.5,0.5,0.5,-5.0,120,5,1,4,0.0,0.0,pop" >> data/source/dataset.csv
          pip install "apache-airflow==2.8.1" -r requirements.txt --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.1/constraints-3.10.txt"
          pip install pytest scikit-learn pandas xgboost sqlalchemy psycopg2-binary
      - run: |
          airflow db migrate
          mkdir -p evidence
          pytest -v | tee evidence/pytest_output.txt
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://airflow:airflow@localhost:5432/spotify_test
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-evidence
          path: evidence/pytest_output.txt