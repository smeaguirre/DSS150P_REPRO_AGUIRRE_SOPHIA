contract_version: 2.0.0
dataset: spotify_tracks
primary_key: track_id
key_pattern: ^[A-Za-z0-9]{22}$
on_violation:
  schema_or_range_error: FAIL_PIPELINE_CIRCUIT_BREAKER
  null_text_or_zero_duration_in_raw: QUARANTINE_TO_PARQUET_AND_DROP_IN_STAGING
columns:
  track_id:
    dtype: object
    nullable: false
    unique_in_curated: true
  artists:
    dtype: object
    nullable: true
    quarantine_on_null: true
  album_name:
    dtype: object
    nullable: true
    quarantine_on_null: true
  track_name:
    dtype: object
    nullable: true
    quarantine_on_null: true
  popularity:
    dtype: int
    nullable: false
    min: 0
    max: 100
  duration_ms:
    dtype: int
    nullable: false
    min: 0
    quarantine_if_lte: 0
  explicit:
    dtype: bool
    nullable: false
  danceability:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  energy:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  key:
    dtype: int
    nullable: false
    min: -1
    max: 11
  loudness:
    dtype: float
    nullable: false
    min: -60.0
    max: 10.0
  mode:
    dtype: int
    nullable: false
    allowed_values:
    - 0
    - 1
  speechiness:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  acousticness:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  instrumentalness:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  liveness:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  valence:
    dtype: float
    nullable: false
    min: 0.0
    max: 1.0
  tempo:
    dtype: float
    nullable: false
    min: 0.0
    max: 300.0
  time_signature:
    dtype: int
    nullable: false
    min: 0
    max: 5
  track_genre:
    dtype: object
    nullable: false
curated_rules:
  target_col: popularity_tier
  allowed_targets:
  - Low
  - Mid
  - High
  split_col: split
  allowed_splits:
  - train
  - test
  disallow_train_test_key_overlap: true
