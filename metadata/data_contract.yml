contract_version: "1.0"
dataset: "spotify_raw_ingestion"
enforcement: "hard_fail"

schema:
  columns:
    - name: "Unnamed: 0"
      type: int
      required: true
    - name: track_id
      type: string
      required: true
    - name: popularity
      type: int
      required: true
      valid_range:
        min: 0
        max: 100
    - name: danceability
      type: float
    - name: energy
      type: float
    - name: loudness
      type: float
    - name: track_genre
      type: string
      required: true

constraints:
  primary_key:
    - "Unnamed: 0"
  uniqueness: true